services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: "80"
      APP_URL: https://gadgetsgarden.aetherhost.com.ng
    volumes:
      - gg_pgdata:/var/lib/postgresql/data
      - gg_storage:/app/backend/storage/app/public
    mem_limit: 512m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aetherhost-net"
      - "traefik.http.routers.gadgetsgarden-app.rule=Host(`gadgetsgarden.aetherhost.com.ng`)"
      - "traefik.http.routers.gadgetsgarden-app.entrypoints=websecure"
      - "traefik.http.routers.gadgetsgarden-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.gadgetsgarden-app.loadbalancer.server.port=80"
    networks:
      - aetherhost-net

networks:
  aetherhost-net:
    external: true

volumes:
  gg_pgdata:
    name: gadgetsgarden_gg_pgdata
  gg_storage:
    name: gadgetsgarden_gg_storage
